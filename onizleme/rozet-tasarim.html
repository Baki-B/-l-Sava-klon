<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#8fa3ae;margin:0;padding:24px;font-family:system-ui}
.sira{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.hucre{text-align:center;color:#20241a;font-size:11px}
.buyuk{transform:scale(4);transform-origin:top left;width:26px;height:26px;margin:0 90px 90px 0}
h3{color:#1b2026;font-size:13px;margin:6px 0}
</style></head><body>
<h3>Gerçek boy (26 px) — farklı il renklerinde, harita zemini üstünde</h3>
<div class="sira" id="gercek"></div>
<h3>4 kat büyütülmüş — biçim denetimi</h3>
<div class="sira" id="buyuk"></div>
<script>
const KALKAN='M13 1.2 L24.2 4.0 V13.8 C24.2 19.3 19.6 23.2 13 25.0 C6.4 23.2 1.8 19.3 1.8 13.8 V4.0 Z';
const PARLAKLIK='M13 1.2 L24.2 4.0 V6.6 L13 4.0 L1.8 6.6 V4.0 Z';
const PIRINC='#b0904f';
function okunakli(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return (r*299+g*587+b*114)/1000>140?'#12181f':'#f4f1e8';}
function kalkan(renk,yazi,olcek){
  const uzun=yazi.length>2;
  return `<svg width="26" height="26" viewBox="0 0 26 26" style="overflow:visible">
    <path d="${KALKAN}" fill="#0e141a"/>
    <path d="${KALKAN}" fill="${renk}" stroke="#0e141a" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="${PARLAKLIK}" fill="${PIRINC}" fill-opacity="0.5"/>
    <text x="13" y="${uzun?15.5:15}" text-anchor="middle" fill="${okunakli(renk)}"
      font-family="system-ui" font-weight="700" font-size="${uzun?10:13}">${yazi}</text>
  </svg>`;
}
// gerçek il renklerinden örnekler (askeri tonlanmış aralık)
const renkler=[['#7b4a3e','1'],['#5d7a5a','7'],['#8a8455','12'],['#4f6b80','34'],['#a89a6a','99'],['#6b5b7a','99+'],['#c9c0a0','5'],['#3c4a55','8']];
document.getElementById('gercek').innerHTML=renkler.map(([r,y])=>
  `<div class="hucre">${kalkan(r,y)}<div>${y}</div></div>`).join('');
document.getElementById('buyuk').innerHTML=[['#7b4a3e','7'],['#c9c0a0','12'],['#4f6b80','99+']].map(([r,y])=>
  `<div class="buyuk">${kalkan(r,y)}</div>`).join('');
</script></body></html>
